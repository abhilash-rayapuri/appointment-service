name: Python-Appointment CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run PyTests
        run: |
          pytest --junitxml=pytest-report.xml

      - name: Upload PyTest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  trivy-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          output: trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  docker:
    runs-on: ubuntu-latest
    needs: trivy-scan

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USER_SHUBAM }}
          password: ${{ secrets.MY_DOCKER_PSSWD_SHUBAM }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.MY_DOCKER_USER_SHUBAM }}/appointment-service:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.MY_DOCKER_USER_SHUBAM }}/appointment-service:latest
