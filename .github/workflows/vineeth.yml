name: Appointment Service CI/CD

on:
  workflow_dispatch:

env:
  IMAGE_NAME: appointment-service
  IMAGE_TAG: v1.0.${{ github.run_number }}

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest tests/ \
          --junitxml=pytest-report.xml \
          -v

      - name: Upload Pytest Report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_VINEETH }}
          password: ${{ secrets.DOCKER_PASSWORD_VINEETH }}

      - name: Tag Docker Image
        run: |
          docker tag \
          $IMAGE_NAME:$IMAGE_TAG \
          vineethmathangi95/python:$IMAGE_TAG

      - name: Push Docker Image
        run: |
          docker push \
          vineethmathangi95/python:$IMAGE_TAG
